  .ag-modal{position:fixed;inset:0;z-index:60;background:rgba(20,30,32,.55);display:flex;align-items:flex-end;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);color-scheme:light}

  .ag-toast{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;position:fixed;left:50%;transform:translateX(-50%);bottom:96px;max-width:calc(100% - 32px);background:#22282a;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;line-height:1.4;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:opacity .4s}

  // "2026-09-29" -> "29/09/2026"

  var _ICONOS = [[/ni[ñn]o|ni[ñn]a|infantil|kids/i,'🧒'],[/hidro|jacuzzi|burbuja/i,'🫧'],[/acu[áa]tic/i,'🏊'],[/masaj|spa\b/i,'💆'],[/piscina/i,'🏊'],[/facial|rostro|piel/i,'✨'],[/sauna|vapor/i,'♨️'],[/fisio|rehab|terap/i,'🩺'],[/reduct|model|corporal/i,'🌿'],

<section class="ag-wrap" style="margin:0 auto" aria-label="Prueba del asistente">
  <div class="ag-card" style="margin-top:12px;background:#eef8ef">
    <p style="margin-top:0"><strong>Catálogo de prueba</strong> · Servicios, conversación y envíos simulados.</p>
    <details id="ag-demo-panel" open>
      <summary style="cursor:pointer;font-weight:700">Te ayudo a elegir</summary>
      <p id="ag-demo-r" role="status">Qué gusto acompañarte. ¿Buscas un masaje relajante, una experiencia para dos o un poco más de tiempo en el spa?</p>
      <form id="ag-demo-chat">
        <label class="ag-lbl" for="ag-demo-pregunta">Cuéntame qué te gustaría</label>
        <input id="ag-demo-pregunta" class="ag-input" maxlength="200" autocomplete="off" placeholder="Ej. Un masaje relajante para dos" required>
        <button type="submit" class="ag-otro">Ver sugerencia</button>
      </form>
      <div id="ag-demo-opciones"></div>
      <button type="button" class="ag-otro" id="ag-demo-siguiente" hidden>Continuar a la solicitud</button>
      <button type="button" class="ag-otro" id="ag-demo-wa">Preparar mensaje para WhatsApp</button>
      <div id="ag-demo-traspaso" hidden>
        <label class="ag-lbl" for="ag-demo-msg">Revisa o edita lo que compartirías con Aguamiel</label>
        <textarea class="ag-input" id="ag-demo-msg" rows="5" maxlength="700"></textarea>
        <button type="button" class="ag-otro" id="ag-demo-abrir">Simular apertura de WhatsApp</button>
        <button type="button" class="ag-otro" id="ag-demo-copiar">Copiar mensaje</button>
        <p id="ag-demo-estado" role="status"></p>
      </div>
    </details>
  </div>
</section>
<script>
window.AG_CATALOGO_PRUEBA = (function(){
  var servicios = [
    { k:'s60', categoria:'Masajes', catMostrar:'Masajes', servicio:'Masaje relajante', mostrar:'Masaje relajante', varianteNombre:'60 min', precio:40 },
    { k:'s90', categoria:'Masajes', catMostrar:'Masajes', servicio:'Masaje relajante', mostrar:'Masaje relajante', varianteNombre:'90 min', precio:55 },
    { k:'sH', categoria:'Hidroterapia', catMostrar:'Hidroterapia', servicio:'Hidromasaje', mostrar:'Hidromasaje', varianteNombre:'30 min', precio:25 }
  ];
  var guardado = null;
  // Toda llamada de este enlace se resuelve aquí. El catálogo de prueba no usa el servidor real.
  AG.srv = function(fn){
    if(fn==='getCatalogoReservaPublica') return Promise.resolve({
      publico:true, solicitud:true, puedeCambiar:true, sinPago:true, servicios:servicios,
      paquetes:[], menu:[], metodos:[], disponibilidad:[], firma:'simulada'
    });
    if(fn==='enviarSolicitudReservaPublica') return Promise.resolve({ simulado:true });
    if(fn==='getOcupadosCatalogo') return Promise.resolve({ ocupados:[] });
    return Promise.reject(new Error('Esta operación no está disponible en el catálogo de prueba.'));
  };
  AG.borrador = function(){ return {
    leer:function(){ return guardado; },
    guardar:function(d){ guardado = d; },
    borrar:function(){ guardado = null; }
  }; };
  var el = function(id){ return document.getElementById('ag-demo-' + id); };
  var dineroPrueba = function(precio){ return '$' + Number(precio).toFixed(2); };
  return function(agregar, continuar, seleccion){
    var personas = 1, duda = '', ultimoBorrador = '';
    if(!el('siguiente').onclick) el('siguiente').onclick = continuar;
    el('chat').onsubmit = function(ev){
      ev.preventDefault();
      var consulta = el('pregunta').value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      if(/pareja|\bdos\b|para 2/.test(consulta)) personas = 2;
      if(/solo|sola|para mi|una persona/.test(consulta)) personas = 1;
      var n = personas;
      var largo = /mas tiempo|90|quedar|combinar/.test(consulta);
      var opciones = largo ? [servicios[1], servicios[2]] : [/hidro|agua/.test(consulta) ? servicios[2] : servicios[0], servicios[1]];
      if(opciones[0]===opciones[1]) opciones = [servicios[0], servicios[1]];
      el('opciones').replaceChildren();
      if(!/masaj|relaj|tiempo|pareja|\bdos\b|hidro|agua|precio|cuanto|combinar|60|90/.test(consulta)){
        duda = el('pregunta').value.trim();
        el('r').textContent = 'Puedo guiarte entre masajes e hidromasaje. Si buscas algo distinto o quieres una cotización especial, puedo preparar un mensaje para el equipo.';
        return;
      }
      el('r').textContent = largo
        ? 'Si quieres quedarte un poco más, puedes elegir el masaje largo o sumar hidromasaje a tu selección.'
        : 'Estas son las opciones de prueba. Puedes elegir una o combinar servicios y revisar el total antes de solicitar tu visita.';
      opciones.forEach(function(s){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'ag-otro';
        b.textContent = 'Agregar ' + n + ' × ' + s.mostrar + ' · ' + s.varianteNombre + ' · ' + dineroPrueba(s.precio * n);
        b.onclick = function(){
          agregar(s.k, n);
          el('siguiente').hidden = false;
          el('r').textContent = 'Agregado. Tu selección suma ' + dineroPrueba(seleccion().total) + '. Puedes ajustarla en el catálogo.';
        };
        el('opciones').appendChild(b);
      });
    };
    el('wa').onclick = function(){
      if(el('msg').value === ultimoBorrador){
        var s = seleccion();
        ultimoBorrador = ['¡Hola, Aguamiel! Me gustaría conversar sobre una visita.'].concat(s.lineas,
          s.lineas.length ? ['Subtotal estimado: ' + dineroPrueba(s.total)] : [],
          duda ? ['Mi consulta: ' + duda] : [],
          ['¿Me ayudan a confirmar el precio y la disponibilidad?']).join('\n');
        el('msg').value = ultimoBorrador;
      }
      el('traspaso').hidden = false; el('msg').focus();
    };
    el('abrir').onclick = function(){
      el('estado').textContent = el('msg').value.trim()
        ? 'El mensaje está listo. En una visita real, aquí se abriría WhatsApp para revisar y enviar.'
        : 'Escribe un mensaje antes de continuar.';
    };
    el('copiar').onclick = function(){
      var m = el('msg'), texto = m.value.trim();
      if(!texto){ el('estado').textContent = 'Escribe un mensaje antes de copiarlo.'; return; }
      var manual = function(){ m.focus(); m.select(); el('estado').textContent = 'El texto quedó seleccionado para copiarlo.'; };
      if(!navigator.clipboard){ manual(); return; }
      navigator.clipboard.writeText(texto).then(function(){ el('estado').textContent = 'Mensaje de prueba copiado.'; }, manual);
    };
  };
})();
</script>

  var token = null, datos = null, lineas = [], sec = 0, regalo = null, enviando = false, enviado = false, borr = null, metodo = '', quien = '', quienBorr = null;
  var reservaPublica = false, contactoPublico = { nombre:'', telefono:'', contacto:'whatsapp', web:'' }, ultimoEnvioPublico = null;

      var img = new Image();
      img.onerror = function(){ mal('No se pudo abrir esa imagen. Prueba con otra.'); };

        var k = Math.min(1, 1400 / Math.max(img.width, img.height)), cv = document.createElement('canvas');

        enviando = false; app.scrollIntoView(); return;
      }
      if(publicoNuevo){
        token = r.token; datos.cliente = contacto.nombre; datos.contacto = contacto.contacto;
        contactoPublico = { nombre:'', telefono:'', contacto:'whatsapp', web:'' }; ultimoEnvioPublico = null;
      }
      // 📋 Resumen final de lo elegido (individual, grupo o catálogo para grupos), calculado antes de cambiar la pantalla.
      var resFinal = ''; try{ resFinal = resumenSeleccionHTML(true); }catch(eR){}
      enviado = true; if(borr) borr.borrar();
      var nombre = String((datos.grupo ? quien : datos.cliente)||'').split(' ')[0];
      if(datos.regaloPagado){
        var lista = fijosDe().map(function(f){ return '<div style="margin-top:4px">• ' + (f.cantidad > 1 ? f.cantidad + ' × ' : '') + esc(f.descripcion) + '</div>'; }).join('');
        app.innerHTML = AG.portada({}) + '<div class="ag-fin"><h2>¡Tu lugar está reservado, ' + esc(nombre) + '! 🎁💙</h2><p style="font-size:15.5px">Reservamos tu lugar para el <strong style="text-transform:capitalize">' + esc(fechaLarga(datos._fecha)) + '</strong> a las <strong>' + esc(horaTxt(datos._hora)) + '</strong>.</p>' +
          (datos._hora && datos._dur ? '<p style="font-size:15px">🕒 Tu visita: <strong>' + esc(horaTxt(datos._hora)) + ' a ' + esc(horaTxt(hhmm(minDe(datos._hora) + datos._dur))) + '</strong> (aprox. ' + esc(durTxt(datos._dur)) + ', incluye tu llegada, cambio de ropa y salida).</p>' : '') +
          (lista ? '<div class="ag-card" style="text-align:left;font-size:14.5px"><div style="font-weight:700">🎁 Tu regalo incluye</div>' + lista + '</div>' : '') +
          '<p style="font-size:15px;color:#1d6b35"><strong>✅ Tu regalo está 100% pagado.</strong> Te escribiremos por WhatsApp con los últimos detalles. ✨</p>' +
          (r && r.extras ? '<div class="ag-card" style="text-align:left;font-size:14.5px;background:#f3f8ff;border-color:#d6e6fb"><div style="font-weight:700">➕ Lo adicional que pediste (' + esc(r.extras.para) + ')</div>' +
            r.extras.items.map(function(it){ return '<div style="margin-top:4px">• ' + (it.cantidad > 1 ? it.cantidad + ' × ' : '') + esc(it.descripcion) + '</div>'; }).join('') +
            '<div style="margin-top:6px">Total a pagar: <strong>' + dinero(r.extras.total) + '</strong>' + (r.extras.totalBs ? ' · 🇻🇪 <strong>' + bs(r.extras.totalBs) + '</strong>' : '') + '</div>' +
            (r.extras.metodo ? '<div style="margin-top:4px">💳 Forma de pago: <strong>' + esc(r.extras.metodo) + '</strong></div>' + (r.extras.pagoDatos ? '<div style="margin-top:6px">' + datosPagoHTML(r.extras.pagoDatos) + '</div>' : '') : '<div class="ag-desc" style="margin-top:4px">Te enviaremos los datos para pagarlo.</div>') + '</div>' +
            postPagoHTML({ total:r.extras.total, pagoReportado:r.pagoReportado, errorCapture:r.errorCapture }) : '') +
          '<p style="color:var(--sub);font-size:13.5px">Si necesitas cambiar el día u hora, puedes volver a abrir este mismo enlace o escribirnos por WhatsApp.</p></div>';
        window.scrollTo(0, 0); if(r && r.extras) conectarPostPago(r); return;
      }
      app.innerHTML = AG.portada({}) + '<div class="ag-fin"><h2>¡Gracias, ' + esc(nombre) + '! 💙</h2>' + (datos.publico ? '<p style="font-size:15.5px">📞 Te responderemos directamente por <strong>' + (datos.contacto === 'llamada' ? 'llamada telefónica' : 'WhatsApp') + '</strong> lo antes posible.</p>' : '') + '<p style="font-size:15.5px">' + (datos.solicitud ? 'Recibimos tu <strong>solicitud de reserva</strong>. Todavía <strong>no está reservada</strong>: revisamos la disponibilidad y te escribimos para confirmar el día y la hora' : 'Recibimos tu selección') + (r && r.total ? ' (' + dinero(r.total) + ')' : '') + '.' +
        (regalo ? ' 🎁 Qué lindo regalo para ' + esc(regalo.nombre.split(' ')[0]) + '.' : '') + '</p>' + (r && r.metodo ? '<p style="font-size:15px">💳 Método de pago elegido: <strong>' + esc(r.metodo) + '</strong>' + (r.totalBs ? '<br>🇻🇪 Total: <strong>' + bs(r.totalBs) + '</strong> <span style="color:var(--sub);font-size:12.5px">(tasa BCV del día: Bs. ' + Number(r.tasaBcv).toLocaleString('es-VE', { minimumFractionDigits:2, maximumFractionDigits:4 }) + ')</span>' : '') + '</p>' + (r.pagoDatos ? '<div class="ag-card" style="text-align:left;font-size:14px">' + datosPagoHTML(r.pagoDatos) + '</div>' : '') : '') + (datos._hora && datos._dur ? '<p style="font-size:15px">🕒 Tu visita estimada: <strong>' + esc(horaTxt(datos._hora)) + ' a ' + esc(horaTxt(hhmm(minDe(datos._hora) + datos._dur))) + '</strong> (aprox. ' + esc(durTxt(datos._dur)) + '). Te lo confirmamos por ' + (datos.contacto === 'llamada' ? 'llamada' : 'WhatsApp') + '.</p>' : '') + (datos._otroDia ? '<p style="font-size:15px">📅 Pediste un día fuera de los horarios publicados: <strong>confirmamos la disponibilidad de nuestras profesionales para ese día</strong> y te escribimos por WhatsApp.</p>' : '') + (r && r.choque ? '<p style="font-size:15px">⚠️ El horario que elegiste ya tenía otra reserva. Te escribiremos para coordinar el mejor horario contigo.</p>' : '') + '<p style="font-size:15px">En breve te enviamos tu presupuesto y te ayudamos a reservar el día. ✨</p>' +
        (WZ ? '<p style="font-size:15px">📞 <strong>El equipo de reservas te contactará para confirmar tu cita.</strong>' + (pagoOp==='despues' && datos._abono ? ' Recuerda tu abono del <strong style="text-transform:capitalize">' + esc(fechaLarga(datos._abono)) + '</strong>.' : '') + (pagoOp==='dia' ? ' 🗓️ Pagas el total el día de tu visita.' : '') + '</p>' : '') +
        (WZ ? '<div class="ag-wz-frase">«' + esc((r && r.frase) || datos.frase || 'Gracias por elegirnos para cuidarte: cada visita tuya es un regalo.') + '»</div>' : '') +
        (resFinal ? '<div class="ag-card" style="text-align:left"><div style="font-weight:700;font-size:15px;margin-bottom:4px">📋 Resumen de lo que elegiste</div>' + resFinal + '</div>' : '') + postPagoHTML(r) +
        '<button type="button" class="ag-otro" id="ag-fin-cambiar" style="margin:4px auto 8px;display:block">✏️ Revisar o cambiar mi selección</button>' +
        '<p style="color:var(--sub);font-size:13.5px">Puedes cambiar lo que elegiste mientras no se haya confirmado la reserva, aquí mismo o volviendo a abrir este enlace.</p>' +
        (datos.grupo ? '<p style="font-size:14.5px">👥 Este enlace es del grupo: pásaselo a las demás personas para que cada una elija lo suyo. Si abren el enlace y escriben su nombre, su selección se une a la tuya.</p>' : '') + '</div>';
      var fc = document.getElementById('ag-fin-cambiar');
      if(fc) fc.onclick = function(){ fc.disabled = true; fc.textContent = 'Abriendo…'; enviado = false; enviando = false; wzPaso = 0; lineas = []; sec = 0; app.setAttribute('aria-busy', 'true'); cargar(); window.scrollTo(0, 0); };
      window.scrollTo(0, 0); conectarPostPago(r);
    }, function(e){
      enviando = false; b.disabled = false; b.textContent = etiquetaEnviar();
      err.textContent = (e && e.message) ? e.message : 'No se pudo enviar. Revisa tu conexión e intenta de nuevo.';
    });
  }
  // Enlace de grupo: cada persona escribe su nombre; así su selección queda separada de la de las demás.
  function pantallaNombre(){
    // Clienta ya registrada: no se le pide el nombre; con un toque entra como ella (quien no sea ella sí escribe el suyo).
    var reg = !!(datos.registrado && String(datos.cliente||'').trim()), pn = String(datos.cliente||'').split(' ')[0];
    app.innerHTML = AG.portada({ titulo:'¡Bienvenido(a)!', sub:'Este es el enlace ' + (datos.evento ? 'del evento <strong>' + esc(datos.evento) + '</strong>' : 'del grupo de ' + esc(datos.cliente)) + '. Cada persona elige lo suyo. 💙' }) +
      '<div class="ag-wrap">' + (reg ? '<div class="ag-card"><div style="font-weight:700;font-size:15px">👋 ¿Eres ' + esc(datos.cliente) + '?</div>' +
        '<button type="button" class="ag-wz-big" id="ag-quien-soy" style="margin-top:8px"><span class="ic">🙋</span><span>Sí, soy ' + esc(pn) + '</span></button></div>' : '') +
      '<div class="ag-card"><div style="font-weight:700;font-size:15px">👤 ' + (reg ? 'No soy ' + esc(pn) + ': ¿cómo te llamas?' : '¿Cómo te llamas?') + '</div><div class="ag-desc" style="margin:2px 0 6px">Escribe tu nombre (y tu inicial del apellido si hay otra persona con el mismo nombre). Si ya habías elegido antes, vuelve a escribir el mismo nombre y recuperas tu selección.</div>' +
      '<input class="ag-input" id="ag-quien" maxlength="60" autocomplete="name" placeholder="Ej: Ana P."/><div class="ag-err" id="ag-quien-err"></div>' +
      '<button type="button" class="ag-enviar" id="ag-quien-ok" style="width:100%;margin-top:10px">Continuar</button></div></div>';
    var soy = document.getElementById('ag-quien-soy');
    if(soy) soy.onclick = function(){ quien = String(datos.cliente).trim(); if(quienBorr) quienBorr.guardar(quien); lineas = []; sec = 0; cargar(); };
    var ok = function(){
      var n = document.getElementById('ag-quien').value.trim().replace(/\s+/g, ' ');
      if(!n){ document.getElementById('ag-quien-err').textContent = 'Escribe tu nombre para continuar.'; return; }
      quien = n; if(quienBorr) quienBorr.guardar(n);
      lineas = []; sec = 0; cargar();
    };
    document.getElementById('ag-quien-ok').onclick = ok;
    document.getElementById('ag-quien').onkeydown = function(ev){ if(ev.key === 'Enter') ok(); };
  }
  function cargar(){
    if(!token && !reservaPublica){ datos = { error:'Este enlace ha caducado. Por favor, contacta al personal de ventas de Aguamiel que te envió este enlace para que te envíe uno nuevo. 🌿' }; pintar(); return; }
    G = null;
    var solicitud = explorandoReserva() ? AG.srv('getCatalogoReservaPublica') : AG.srv('getCatalogoPublico', token, quien);
    solicitud.then(function(d){
      datos = d || { error:'No se pudo cargar.' }; piscReglas(datos.piscReglas);
      if(datos && datos.descMin !== undefined && datos.descMin !== null) DESC_DIVISAS_MIN = Number(datos.descMin) || 0;
      // En los enlaces de grupo no van los servicios extra, ni la piscina ni las áreas comunes: eso ya está en el cálculo del grupo.
      if(datos.grupo || datos.grupal){
        datos.servicios = (datos.servicios||[]).filter(function(s){
          return !/extra/i.test(String(s.categoria||'') + ' ' + String(s.catMostrar||'')) && !/piscina|[aá]reas?\s+comunes/i.test([s.servicio, s.mostrar, s.nombre, s.variante, s.categoria, s.catMostrar].join(' '));
        });
      }
      // Los borradores de este equipo se guardan por persona cuando el enlace es de grupo.
      borr = AG.borrador(explorandoReserva() ? 'catalogo_reserva_borrador_v400' : 'catalogo_' + token + (datos.grupo && quien ? '_' + slug(quien) : ''));
      var el = datos.elegido;
      if(el){
        (el.items||[]).forEach(function(x){ if(!x.k || !porClave(x.k)) return; var libre = lineas.filter(function(l){ return l.k===x.k && !l.cantidad; })[0]; var l = libre || nuevaLinea(x.k); l.cantidad = Number(x.cantidad)||0; l.opciones = (x.opciones||[]).slice(); });
        datos._notas = el.notas || ''; datos._fecha = el.fecha || ''; datos._hora = el.hora || ''; metodo = el.metodoPago || '';
        if(el.beneficiario && el.beneficiario.nombre){ regalo = { nombre:el.beneficiario.nombre, telefono:el.beneficiario.telefono||'' }; if(!qv.modo) qv.modo = 'regalo'; }
        if(el.extrasPara && el.extrasPara.tipo) extrasPara = { tipo:el.extrasPara.tipo, nombre:el.extrasPara.nombre||'', telefono:el.extrasPara.telefono||'' };
      } else if(!datos.error){
        // Sin selección guardada en el servidor: se recupera el borrador de este equipo.
        var bd = borr && borr.leer();
        if(bd){
          (bd.items||[]).forEach(function(x){ if(!x.k || !porClave(x.k)) return; var libre = lineas.filter(function(l){ return l.k===x.k && !l.cantidad; })[0]; var l = libre || nuevaLinea(x.k); l.cantidad = Number(x.cantidad)||0; l.opciones = (x.opciones||[]).slice(); });
          datos._notas = bd.notas || ''; datos._fecha = bd.fecha || ''; datos._hora = bd.hora || ''; metodo = bd.metodo || ''; datos._otroDia = !!bd.otroDia;
          if(bd.regalo && bd.regalo.nombre !== undefined) regalo = { nombre:bd.regalo.nombre||'', telefono:bd.regalo.telefono||'' };
          if(bd.qv && bd.qv.modo) qv = { modo:bd.qv.modo, obj:String(bd.qv.obj||''), personas:(bd.qv.personas||[]).map(function(p){ return { nombre:String(p.nombre||''), sexo:String(p.sexo||'') }; }) };
          if(bd.abono) datos._abono = bd.abono;
          if(typeof bd.wz === 'number' && bd.wz > 0){ wzPaso = bd.wz; wzComida = bd.wzComida || ''; wzAgua = bd.wzAgua || ''; }   // 📍 v389: retoma el paso
          datos._recuperado = lineas.some(function(l){ return l.cantidad > 0; }) || wzPaso > 0;
        }
      }
      // Si ya había enviado un día que no está entre los horarios publicados, se muestra como «otro día».
      if(!datos.error && (datos.disponibilidad||[]).length && datos._fecha && !rangoSel()) datos._otroDia = true;
      botonDudas(datos.waDudas, datos.cliente);
      pintar();
      if(demoCatalogo && !datos.error){
        demoCatalogo(function(k, cantidad){
          var l = lineas.filter(function(x){ return x.k === k; })[0];
          if(l) cambiar(l.lid, cantidad);
        }, function(){ if(total().n){ wzIr('quien'); document.getElementById('ag-demo-panel').open = false; app.scrollIntoView(); } },
        function(){ return { total:total().t, lineas:lineas.filter(function(l){ return l.cantidad > 0 && porClave(l.k); }).map(function(l){
          var s = porClave(l.k);
          return '• ' + l.cantidad + ' × ' + s.mostrar + (s.varianteNombre ? ' · ' + s.varianteNombre : '');
        }) }; });
      } else if(explorandoReserva() && !datos.error) registrarVisita();
    }, function(){ datos = { error:'No se pudo cargar. Revisa tu conexión e intenta de nuevo. 🌿' }; pintar(); });
  }
  // 💬 v377: botón «¿Dudas?» en todos los catálogos: abre el WhatsApp de la administración (el número se pone en Admin → Presupuestos → 🌐 Enlace público).
  function botonDudas(num, cliente){
    num = String(num || '').replace(/\D/g, ''); var b = document.getElementById('ag-dudas');
    if(!num){ if(b) b.remove(); return; }
    if(!b){ b = document.createElement('button'); b.type = 'button'; b.id = 'ag-dudas'; b.innerHTML = '<span>💬</span><span>Dudas</span>'; b.setAttribute('aria-label', 'Escríbenos por WhatsApp si tienes dudas'); document.body.appendChild(b); }
    b.onclick = function(){
      var pn = String(cliente || '').split(' ')[0];
      var txt = '¡Hola! ' + (pn ? 'Soy ' + pn + '. ' : '') + 'Tengo una duda sobre Aguamiel 🌿';
      window.open('https:' + String.fromCharCode(47, 47) + 'wa.me/' + num + '?text=' + encodeURIComponent(txt), '_blank', 'noopener');
    };
  }
  if(demoCatalogo){ reservaPublica = true; cargar(); return; }
  AG.parametro('catalogo').then(function(t){
    if(t){ token = t; quienBorr = AG.borrador('catalogo_quien_' + t, 30); quien = quienBorr.leer() || ''; cargar(); return; }
    AG.parametro('reservar').then(function(r){ reservaPublica = !!r; cargar(); }, function(){ cargar(); });
  });
})();
