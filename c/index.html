<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Aguamiel</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f8f6;color:#22282a;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:16px}
  a{color:#0d9bb5;font-weight:700}
</style>
</head>
<body>
<!-- Enlace corto (v341, ampliado en v387): el código va después de «#» (no llega a GitHub) y se pasa tal cual a la app de Google.
     Sin letra delante = catálogo. m- menú · e- encuesta · p- postventa · i- informe · k- confirmar reserva. -->
<p id="m">🌿 Abriendo Aguamiel…</p>
<script>
(function(){
  var APP = 'https://script.google.com/macros/s/AKfycbyvzuGSC4rECcef_3-kZkhHm3rZdtuBx52qr-ZfBZwtpoJP1WwJOdFbfKpyV3_gULNB/exec';
  var TIPOS = { m:['menu', 'el menú del Rincón de Rosita'], e:['encuesta', 'tu encuesta'], p:['postventa', 'tu mensaje de Aguamiel'], i:['informe', 'tu informe'], k:['confirmar', 'tu confirmación'] };
  var h = String(location.hash || '').replace(/^#/, ''), x = h.match(/^(?:([a-z])-)?([A-Za-z0-9]{8,48})$/);
  var t = x ? (x[1] ? TIPOS[x[1]] : ['catalogo', 'tu catálogo']) : null;
  if(!t){ document.getElementById('m').textContent = 'Este enlace no es válido. Pide uno nuevo a quien te lo envió. 🌿'; return; }
  var url = APP + '?' + t[0] + '=' + encodeURIComponent(x[2]);
  document.getElementById('m').innerHTML = '🌿 Abriendo ' + t[1] + ' de Aguamiel… <br><br><a href="' + url + '">Toca aquí si no se abre</a>';
  location.replace(url);
})();
</script>
</body>
</html>
